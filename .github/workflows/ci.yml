name: CI

# Runs only on demand (Actions → CI → Run workflow) while the GitHub Actions minutes limit is reached.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Firestore emulator used by the security rules tests runs on Java.
      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck and build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Firestore security rules tests
        run: npm run test:rules
